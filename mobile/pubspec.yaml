name: queuepe_mobile
description: QueuePe — Skip the Line. Flutter mobile app for queue standing services.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Supabase (same backend as web)
  supabase_flutter: ^2.9.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Forms & Validation
  flutter_form_builder: ^9.5.0
  form_builder_validators: ^11.1.0

  # HTTP & Networking
  http: ^1.4.0
  dio: ^5.8.0

  # Storage & Caching
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # UI Components
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  # Location / Maps
  geolocator: ^14.0.0
  google_maps_flutter: ^2.12.2

  # Camera & Media
  camera: ^0.11.1
  image_picker: ^1.1.2

  # Razorpay Payments
  razorpay_flutter: ^1.3.7

  # Notifications
  flutter_local_notifications: ^19.0.0

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  timeago: ^3.7.0

  # Icons
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15

dependency_overrides:
  intl: ^0.20.2

flutter:
  uses-material-design: true

  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf

    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

  assets:
    - assets/images/
    - assets/icons/
